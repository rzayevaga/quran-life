<!-- index.html -->
<!DOCTYPE html>
<html lang="az" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#1a0a00">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Qur'an Life">
    <meta name="application-version" content="2.0.1">
    <meta name="description" content="Qur'an Life [LM] - Quran oxu, tərcümə və transkripsiya ilə.">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <title>Qur'an Life [LM]</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Scheherazade+New:wght@400;600;700&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <div class="bg-pattern"></div>
        <div class="bg-glow bg-glow-1"></div>
        <div class="bg-glow bg-glow-2"></div>
        <div class="bg-glow bg-glow-3"></div>
        <div class="floating-particles" id="particles"></div>
        <header class="app-header">
            <div class="header-top">
                <div class="logo-3d">
                    <div class="logo-cube">
                        <div class="cube-face front">ﷲ</div>
                        <div class="cube-face back">علي</div>
                        <div class="cube-face right">حسن</div>
                        <div class="cube-face left">حسين</div>
                        <div class="cube-face top">☾</div>
                        <div class="cube-face bottom">★</div>
                    </div>
                </div>
                <h1 class="app-title">
                    <span class="title-ar">حياة القرآن</span>
                    <span class="title-main">Qur'an Life</span>
                    <span class="title-sub">[LM]</span>
                </h1>
            </div>
            <div class="header-stats">
                <div class="stat-item">
                    <span class="stat-value" id="currentSurah">1</span>
                    <span class="stat-label">Surə</span>
                </div>
                <div class="stat-divider"></div>
                <div class="stat-item">
                    <span class="stat-value" id="currentAyah">1</span>
                    <span class="stat-label">Ayə</span>
                </div>
                <div class="stat-divider"></div>
                <div class="stat-item">
                    <span class="stat-value" id="currentJuz">1</span>
                    <span class="stat-label">Cüz</span>
                </div>
            </div>
        </header>
        <main class="app-content" id="mainContent">
            <div class="surah-selector">
                <div class="selector-3d-card" id="surahSelectorCard">
                    <div class="card-inner-glow"></div>
                    <select id="surahSelect" class="custom-select"></select>
                    <div class="select-arrow">
                        <svg width="20" height="20" viewBox="0 0 20 20"><path d="M5 7l5 5 5-5" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
                    </div>
                </div>
            </div>
            <div class="quran-display" id="quranDisplay">
                <div class="ayah-card" id="ayahCard">
                    <div class="card-3d-shadow"></div>
                    <div class="card-content">
                        <div class="ayah-arabic" id="ayahArabic"></div>
                        <div class="ayah-divider">
                            <svg width="120" height="12" viewBox="0 0 120 12"><path d="M0 6 Q30 0 60 6 Q90 12 120 6" stroke="url(#dividerGradient)" stroke-width="1.5" fill="none"/><defs><linearGradient id="dividerGradient" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#ff8c42" stop-opacity="0"/><stop offset="30%" stop-color="#ff8c42" stop-opacity="1"/><stop offset="70%" stop-color="#ff8c42" stop-opacity="1"/><stop offset="100%" stop-color="#ff8c42" stop-opacity="0"/></linearGradient></defs></svg>
                        </div>
                        <div class="ayah-transliteration" id="ayahTransliteration"></div>
                        <div class="ayah-translation" id="ayahTranslation"></div>
                        <div class="ayah-info">
                            <span class="ayah-number" id="ayahNumber"></span>
                            <span class="surah-name" id="surahNameDisplay"></span>
                        </div>
                        <button class="share-btn" id="shareAyahBtn" title="Paylaş">
                            <svg width="18" height="18" viewBox="0 0 24 24"><circle cx="6" cy="12" r="2.5" fill="currentColor"/><circle cx="18" cy="6" r="2.5" fill="currentColor"/><circle cx="18" cy="18" r="2.5" fill="currentColor"/><path d="M8 11l8-5M8 13l8 5" stroke="currentColor" stroke-width="2" fill="none"/></svg>
                        </button>
                    </div>
                </div>
                <div class="ayah-nav">
                    <button class="nav-btn nav-prev" id="prevAyah">
                        <svg width="24" height="24" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg>
                    </button>
                    <div class="nav-indicator">
                        <span id="ayahIndicator">1 / 7</span>
                    </div>
                    <button class="nav-btn nav-next" id="nextAyah">
                        <svg width="24" height="24" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg>
                    </button>
                </div>
            </div>
            <div class="search-container" id="searchContainer">
                <div class="search-3d-wrapper">
                    <div class="search-input-group">
                        <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8" stroke="currentColor" stroke-width="2.5" fill="none"/><path d="M17.5 17.5L22 22" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg>
                        <input type="text" id="searchInput" class="search-input" placeholder="Surə, ayə və ya söz axtar...">
                        <button class="search-clear" id="searchClear" style="display:none;">
                            <svg width="18" height="18" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg>
                        </button>
                    </div>
                    <div class="search-results" id="searchResults"></div>
                </div>
            </div>
            <div class="settings-panel" id="settingsPanel">
                <div class="settings-card">
                    <h3 class="settings-title">Ayarlar</h3>
                    <div class="setting-group">
                        <label class="setting-label">Ərəbcə Şrift Ölçüsü</label>
                        <input type="range" id="arabicFontSize" min="20" max="60" value="36" class="setting-range">
                        <span class="range-value" id="arabicSizeValue">36px</span>
                    </div>
                    <div class="setting-group">
                        <label class="setting-label">Tərcümə Şrift Ölçüsü</label>
                        <input type="range" id="transFontSize" min="12" max="28" value="16" class="setting-range">
                        <span class="range-value" id="transSizeValue">16px</span>
                    </div>
                    <div class="setting-group">
                        <label class="setting-label">Gecə Modu (Avto)</label>
                        <div class="toggle-wrapper">
                            <input type="checkbox" id="nightMode" class="toggle-input">
                            <label for="nightMode" class="toggle-label"></label>
                        </div>
                    </div>
                    <div class="setting-group">
                        <label class="setting-label">3D Effektlər</label>
                        <div class="toggle-wrapper">
                            <input type="checkbox" id="effects3D" class="toggle-input" checked>
                            <label for="effects3D" class="toggle-label"></label>
                        </div>
                    </div>
                    <div class="setting-group">
                        <label class="setting-label">Avtomatik Scroll</label>
                        <div class="toggle-wrapper">
                            <input type="checkbox" id="autoScroll" class="toggle-input">
                            <label for="autoScroll" class="toggle-label"></label>
                        </div>
                    </div>
                    <div class="setting-group">
                        <label class="setting-label">Xatırlatma (Sübh/Axşam)</label>
                        <div class="toggle-wrapper">
                            <input type="checkbox" id="reminderToggle" class="toggle-input">
                            <label for="reminderToggle" class="toggle-label"></label>
                        </div>
                    </div>
                    <button class="btn-close-settings" id="closeSettings">Bağla</button>
                    <div class="app-version" style="text-align:center; margin-top:12px; font-size:12px; color:var(--text-muted);">
                        Versiya 2.0.1
                    </div>
                </div>
            </div>
        </main>
        <nav class="bottom-nav">
            <div class="nav-3d-bar">
                <button class="nav-tab active" data-tab="quran">
                    <svg width="22" height="22" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h12" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round"/><circle cx="20" cy="18" r="2.5" fill="currentColor" opacity="0.6"/></svg>
                    <span>Quran</span>
                </button>
                <button class="nav-tab" data-tab="search">
                    <svg width="22" height="22" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8" stroke="currentColor" stroke-width="2.5" fill="none"/><path d="M17.5 17.5L22 22" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg>
                    <span>Axtar</span>
                </button>
                <button class="nav-tab" data-tab="settings">
                    <svg width="22" height="22" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2.5" fill="none"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z" stroke="currentColor" stroke-width="2" fill="none"/></svg>
                    <span>Ayarlar</span>
                </button>
            </div>
        </nav>
    </div>
    <div class="toast" id="toast"></div>
    <div class="pwa-install-banner" id="pwaInstallBanner">
        <div class="banner-content">
            <span>Bu tətbiqi cihazınıza quraşdırın</span>
            <button id="installPwaBtn">Quraşdır</button>
            <button id="dismissBannerBtn">✕</button>
        </div>
    </div>
    <script src="data/quran.json"></script>
    <script src="js/app.js"></script>
</body>
</html>
